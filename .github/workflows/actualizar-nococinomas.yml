# Actualiza el catálogo de tuppers de nococinomas una vez por semana (gratis en repositorios públicos).
# También puedes lanzarlo a mano: pestaña "Actions" → "Actualizar catálogo nococinomas" → "Run workflow".
name: Actualizar catálogo nococinomas

on:
  schedule:
    - cron: '0 5 * * 1'   # lunes a las 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer catálogo
        run: python scripts/scrape_nococinomas.py data/nococinomas.json
      - name: Guardar cambios
        run: |
          git config user.name "TupperFit bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nococinomas.json
          git diff --cached --quiet || (git commit -m "Actualizar catálogo nococinomas" && git push)
